<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TneenVoice Studio">
  <defs>
    <linearGradient id="tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1B33"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(46 14) rotate(120) scale(40)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voice" x1="10" y1="36" x2="54" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="url(#glow)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <!-- T mark -->
  <path d="M18 16h28M32 16v22" fill="none" stroke="#E8EEF8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- voice wave under the stem -->
  <path d="M14 46c3.5 0 4.5-6 8-6s3.5 12 8 12 3.5-18 8-18 3.5 12 8 12 4-6 8-6" fill="none" stroke="url(#voice)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
